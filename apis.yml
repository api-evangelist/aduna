apis:
- aid: aduna:aduna-number-verification-api
  name: Aduna Number Verification API
  description: >-
    Aduna's aggregated implementation of the CAMARA Number Verification API (v2.1), confirming
    possession of a mobile phone number in real time by verifying it directly against the carrier
    network with minimal or no user input, as a replacement for SMS one-time passwords. Aduna
    states this API is live, including a July 2026 launch across AT&T, T-Mobile and Verizon in the
    United States. The contract exposes verify and read (device-phone-number) operations and is
    reached through network-based (authorization code) or SIM-based (JWT-Bearer and CIBA)
    authorization. Endpoint paths and OAuth scopes are visible in Aduna's public SDK source; the
    base URL is a deployment configuration value and is not published.
  humanURL: https://adunaglobal.com/api-segments/security/
  tags:
  - Number Verification
  - Authentication
  - CAMARA
  - Fraud Prevention
  properties:
  - type: Documentation
    url: https://adunaglobal.com/api-segments/security/
  - type: APIReference
    url: https://docs.adunaglobal.com/how-to-enable-an-api/number-verification-api-v-2.1-landing-page
  - type: SDK
    url: https://github.com/adunaglobal/nv2-asp-server-java-aduna-sdk
  - type: SDK
    url: https://github.com/adunaglobal/nv2-asp-android-aduna-sdk
  - type: SDK
    url: https://github.com/adunaglobal/nv2-asp-ios-aduna-sdk
  - type: SDK
    url: https://github.com/adunaglobal/nv2-asp-web-aduna-sdk
  - type: SDK
