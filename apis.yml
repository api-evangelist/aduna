- aid: aduna:aduna-sim-swap-api
  name: Aduna SIM Swap API
  description: >-
    Aduna's aggregated implementation of the CAMARA SIM Swap API, returning real-time information
    about recent SIM card changes associated with a mobile phone number so an application can
    detect account-takeover risk and trigger additional security checks. Aduna lists this API as
    currently live or in development. A SIM Swap Subscriptions variant, which would push
    notifications rather than answer one-time queries, is listed as available soon. No OpenAPI
    definition, base URL or sandbox is published publicly; the reference documentation sits behind
    the Auth0 login wall on the Aduna portal.
  humanURL: https://adunaglobal.com/api-segments/security/
  tags:
  - SIM Swap
  - Fraud Prevention
  - CAMARA
  - Security
  properties:
  - type: Documentation
    url: https://adunaglobal.com/api-segments/security/
  - type: APIReference
    url: https://docs.adunaglobal.com/
  - type: Specification
    url: https://github.com/camaraproject/SimSwap
- aid: aduna:aduna-kyc-match-api
  name: Aduna KYC Match API
  description: >-
    Aduna's aggregated implementation of the CAMARA KYC Match API, comparing customer-supplied
    identity attributes — name, phone number, birthdate, address, email — against the verified KYC
    data held by the user's mobile network operator, returning match results without returning
    personally identifiable information to the caller. Aduna lists this API as currently live or in
    development. No OpenAPI definition, base URL or sandbox is published publicly; the reference
    documentation sits behind the Auth0 login wall on the Aduna portal.
  humanURL: https://adunaglobal.com/api-segments/identity/
  tags:
  - KYC
  - Identity Verification
  - CAMARA
  - Onboarding
  properties:
  - type: Documentation
    url: https://adunaglobal.com/api-segments/identity/
  - type: APIReference
    url: https://docs.adunaglobal.com/
