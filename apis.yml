name: Aduna
kind: company
description: >-
  Aduna is the Ericsson-led network API joint venture — a 50:50 company owned half by Ericsson
  (Stockholm, Sweden) and half by twelve global communications service providers including AT&T,
  Bharti Airtel, Deutsche Telekom, KDDI, Orange, Reliance Jio, Singtel, Telefonica, Telstra,
  T-Mobile, Verizon and Vodafone, with e& added later as an equity partner. Announced from
  Stockholm and incorporated as Aduna Global, LLC, it exists to aggregate CAMARA-standardised
  mobile network APIs from many carriers into one commercial channel so that developers do not
  have to negotiate operator by operator. Aduna sits in the exposure layer of the telecom value
  chain: it does not own spectrum and it does not sell to developers directly at scale — it
  aggregates operator capability and reaches the market through partner platforms (Google Cloud,
  Infobip, Sinch, Vonage, Microsoft Azure and the Azure Marketplace, Comviva on AWS, Bridge
  Alliance). Its API posture is honestly partner-gated. The public website documents an API
  catalogue in prose but publishes no OpenAPI, no sandbox and no self-serve signup; the developer
  documentation at docs.adunaglobal.com redirects every path to an Auth0 login wall at
  portal.adunaglobal.com, and the SDK onboarding instruction is to contact Aduna Global. The one
  genuinely open surface is a small set of source-available first-party SDK repositories on GitHub
  for CAMARA Number Verification v2, which are the only place Aduna's real endpoints, OAuth scopes
  and CIBA flow are publicly visible.
