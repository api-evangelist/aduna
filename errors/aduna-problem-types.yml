handling_rules:
- rule: Any API error response on verify or read always raises an exception.
  source: https://github.com/adunaglobal/nv2-asp-server-java-aduna-sdk#dual-sim-support
- rule: >-
    In a dual-SIM configuration, a 4xx on an AUTHORIZATION request for one operator token is
    ignored if the other operator token succeeded. If both fail with 4xx, that 4xx is raised.
- rule: >-
