flow:
- step: 1
  call: POST /auth/auth-info
  produces: AuthInfoData
  note: Returns the authorization options available for the phone number or PLMN.
- step: 2
  call: network-based redirect chain OR POST /auth/bc-authorize + POST /auth/token OR JWT-Bearer assertion to POST /auth/token
  produces: AccessToken
- step: 3
  call: POST /number-verification/v2/verify OR GET /number-verification/v2/device-phone-number
  produces: NumberVerificationVerifyResponseData / NumberVerificationReadResponseData
